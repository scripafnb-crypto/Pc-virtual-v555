name: PC Virtual V5 - AnyDesk

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    name: PC Virtual Windows
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ==========================================
      # INFORMAÇÕES DO PC
      # ==========================================
      - name: Informações do PC
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "        PC VIRTUAL V5"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Sistema operacional:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "Processador:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "Memória RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          $ramGB = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)
          Write-Host "$ramGB GB"

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name, AdapterRAM

          Write-Host ""
          Write-Host "Disco:"
          Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" |
            Select-Object DeviceID,
              @{Name="TotalGB";Expression={[math]::Round($_.Size / 1GB,2)}},
              @{Name="LivreGB";Expression={[math]::Round($_.FreeSpace / 1GB,2)}}

          Write-Host ""
          Write-Host "======================================"

      # ==========================================
      # PREPARAR PASTAS
      # ==========================================
      - name: Preparar PC
        shell: powershell
        run: |
          Write-Host "Preparando PC..."

          New-Item -ItemType Directory -Force -Path "C:\PC-V5" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\PC-V5\Apps" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\PC-V5\Downloads" | Out-Null

          Write-Host "Pastas criadas."

      # ==========================================
      # BAIXAR ANYDESK
      # ==========================================
      - name: Baixar AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $arquivo = "C:\PC-V5\Downloads\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $arquivo `
            -UseBasicParsing

          if (!(Test-Path $arquivo)) {
              throw "Falha ao baixar o AnyDesk."
          }

          Write-Host "AnyDesk baixado com sucesso."

      # ==========================================
      # INSTALAR ANYDESK
      # ==========================================
      - name: Instalar AnyDesk
        shell: powershell
        run: |
          $installer = "C:\PC-V5\Downloads\AnyDesk.exe"
          $installPath = "C:\Program Files (x86)\AnyDesk"

          Write-Host "Instalando AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--install `"$installPath`" --start-with-win --silent" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 10

          $anydesk = "$installPath\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
              throw "AnyDesk.exe não foi encontrado após a instalação."
          }

          Write-Host "AnyDesk instalado."

      # ==========================================
      # INICIAR ANYDESK
      # ==========================================
      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
              throw "AnyDesk não encontrado."
          }

          Write-Host "Iniciando AnyDesk..."

          Start-Process `
            -FilePath $anydesk `
            -ArgumentList "--start" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          $processo = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if ($processo) {
              Write-Host "AnyDesk está executando."
          }
          else {
              Write-Host "Aviso: processo AnyDesk não encontrado."
          }

      # ==========================================
      # CONFIGURAR SENHA
      # ==========================================
      - name: Configurar acesso não supervisionado
        shell: powershell
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
              throw "AnyDesk.exe não encontrado."
          }

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
              throw "O Secret ANYDESK_PASSWORD não foi configurado."
          }

          if ($env:ANYDESK_PASSWORD.Length -lt 8) {
              throw "A senha do AnyDesk precisa ter pelo menos 8 caracteres."
          }

          Write-Host "Configurando acesso não supervisionado..."

          # Criar processo do AnyDesk
          $psi = New-Object System.Diagnostics.ProcessStartInfo

          $psi.FileName = $anydesk
          $psi.Arguments = "--set-password"

          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true

          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true

          $process = New-Object System.Diagnostics.Process
          $process.StartInfo = $psi

          $process.Start() | Out-Null

          # Enviar senha pelo stdin.
          # A senha NÃO aparece no log.
          $process.StandardInput.WriteLine($env:ANYDESK_PASSWORD)
          $process.StandardInput.Close()

          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()

          $process.WaitForExit()

          Write-Host "Código retornado pelo AnyDesk: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Host "O AnyDesk recusou a configuração da senha."
              throw "Falha ao configurar o acesso não supervisionado."
          }

          Write-Host "Acesso não supervisionado configurado."

      # ==========================================
      # OBTER ID
      # ==========================================
      - name: Obter ID do AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
              throw "AnyDesk não encontrado."
          }

          Write-Host "Obtendo ID do AnyDesk..."

          Start-Sleep -Seconds 5

          $resultado = & $anydesk --get-id 2>$null

          $id = ($resultado | Out-String).Trim()

          Write-Host ""
          Write-Host "======================================"
          Write-Host "        ANYDESK ONLINE"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "ID DO ANYDESK:"
          Write-Host $id
          Write-Host ""
          Write-Host "Use esse ID no aplicativo AnyDesk."
          Write-Host "======================================"

          if ([string]::IsNullOrWhiteSpace($id)) {
              throw "Não foi possível obter o ID do AnyDesk."
          }

      # ==========================================
      # VERIFICAR ANYDESK
      # ==========================================
      - name: Verificar AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "Verificando AnyDesk..."

          Write-Host ""
          Write-Host "Versão:"
          & $anydesk --version

          Write-Host ""
          Write-Host "Processo:"
          Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue |
            Select-Object Name, Id, CPU

          Write-Host ""
          Write-Host "Status: PC VIRTUAL ONLINE"

      # ==========================================
      # MANTER PC ONLINE
      # ==========================================
      - name: PC Virtual V5 Online
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PC VIRTUAL V5 ONLINE"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "O PC continuará ligado."
          Write-Host "Conecte pelo AnyDesk usando o ID mostrado acima."
          Write-Host ""

          # Aproximadamente 350 minutos.
          # O workflow possui limite de 360 minutos.
          $totalMinutos = 350

          for ($minuto = 1; $minuto -le $totalMinutos; $minuto++) {

              $restantes = $totalMinutos - $minuto

              Write-Host "PC ONLINE | Minuto: $minuto/$totalMinutos | Restantes: $restantes minutos"

              Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Tempo do PC Virtual encerrado."
