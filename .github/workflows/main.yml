name: PC Virtual V5 - AnyDesk

on:
  workflow_dispatch:

jobs:
  pc-virtual:
    name: Windows PC V5
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ==========================================
      # INFORMAÇÕES DO PC
      # ==========================================

      - name: Informações do PC
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "        PC VIRTUAL V5"
          Write-Host "======================================"
          Write-Host ""

          Write-Host "Sistema:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host ("{0:N2} GB" -f ($ram.TotalPhysicalMemory / 1GB))

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name

          Write-Host ""
          Write-Host "Disco:"
          Get-PSDrive C |
            Select-Object Name,
              @{N="UsadoGB";E={[math]::Round($_.Used/1GB,2)}},
              @{N="LivreGB";E={[math]::Round($_.Free/1GB,2)}}


      # ==========================================
      # CRIAR PASTAS
      # ==========================================

      - name: Preparar PC
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\PC-V5 | Out-Null
          New-Item -ItemType Directory -Force C:\PC-V5\Apps | Out-Null
          New-Item -ItemType Directory -Force C:\PC-V5\Downloads | Out-Null

          Write-Host "Pastas criadas."


      # ==========================================
      # BAIXAR ANYDESK
      # ==========================================

      - name: Baixar AnyDesk
        shell: powershell
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $arquivo = "$env:TEMP\AnyDesk.exe"

          Write-Host "Baixando AnyDesk..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $arquivo

          if (!(Test-Path $arquivo)) {
            throw "Falha ao baixar AnyDesk."
          }

          Write-Host "Download concluído."


      # ==========================================
      # INSTALAR ANYDESK
      # ==========================================

      - name: Instalar AnyDesk
        shell: powershell
        run: |
          $installer = "$env:TEMP\AnyDesk.exe"
          $pasta = "C:\Program Files (x86)\AnyDesk"

          Write-Host "Instalando AnyDesk..."

          Start-Process `
            -FilePath $installer `
            -ArgumentList "--install `"$pasta`" --start-with-win --silent" `
            -Wait

          Start-Sleep -Seconds 10

          $anydesk = "$pasta\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk não foi encontrado após a instalação."
          }

          Write-Host "AnyDesk instalado com sucesso."


      # ==========================================
      # INICIAR ANYDESK
      # ==========================================

      - name: Iniciar AnyDesk
        shell: powershell
        run: |
          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "Iniciando AnyDesk..."

          Start-Process `
            -FilePath $anydesk

          Start-Sleep -Seconds 15

          Write-Host "AnyDesk iniciado."


      # ==========================================
      # CONFIGURAR SENHA
      # ==========================================

      - name: Configurar acesso não supervisionado
        shell: powershell
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (!(Test-Path $anydesk)) {
            throw "AnyDesk.exe não encontrado."
          }

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "O Secret ANYDESK_PASSWORD não foi configurado."
          }

          if ($env:ANYDESK_PASSWORD.Length -lt 8) {
            throw "A senha precisa ter pelo menos 8 caracteres."
          }

          Write-Host "Configurando acesso não supervisionado..."

          $env:ANYDESK_PASSWORD |
            & $anydesk --set-password _unattended_access

          if ($LASTEXITCODE -ne 0) {
            throw "AnyDesk recusou a configuração da senha. Código: $LASTEXITCODE"
          }

          Write-Host "Acesso não supervisionado configurado."


      # ==========================================
      # OBTER ID DO ANYDESK
      # ==========================================

      - name: Obter ID do AnyDesk
        shell: powershell
        run: |

          $anydesk = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          Write-Host "Aguardando AnyDesk..."

          Start-Sleep -Seconds 10

          $id = (& $anydesk --get-id | Out-String).Trim()

          if ([string]::IsNullOrWhiteSpace($id)) {
            throw "Não foi possível obter o ID do AnyDesk."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PC VIRTUAL V5 ONLINE"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "ANYDESK ID:"
          Write-Host $id
          Write-Host ""
          Write-Host "Usuário: acesso não supervisionado"
          Write-Host "Senha: a definida no Secret"
          Write-Host ""
          Write-Host "======================================"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "# 🖥️ PC Virtual V5"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value ""

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "## AnyDesk ID"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $id

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value ""

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "PC ONLINE."


      # ==========================================
      # TESTAR ANYDESK
      # ==========================================

      - name: Verificar AnyDesk
        shell: powershell
        run: |

          $processo = Get-Process AnyDesk -ErrorAction SilentlyContinue

          if ($null -eq $processo) {
            Write-Host "AnyDesk não está em execução."
            exit 1
          }

          Write-Host "AnyDesk está funcionando."

          Get-Process AnyDesk |
            Select-Object Id, ProcessName


      # ==========================================
      # MANTER PC ONLINE
      # ==========================================

      - name: PC Virtual V5 Online
        shell: powershell
        run: |

          $inicio = Get-Date

          # Aproximadamente 5h50
          # Mantém margem antes do limite de 6h.
          $limite = 350

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PC VIRTUAL V5 ONLINE"
          Write-Host "======================================"
          Write-Host ""

          while (((Get-Date) - $inicio).TotalMinutes -lt $limite) {

            $decorrido = [math]::Floor(
              ((Get-Date) - $inicio).TotalMinutes
            )

            $restante = $limite - $decorrido

            Write-Host ""
            Write-Host "PC ONLINE"
            Write-Host "Tempo usado: $decorrido minutos"
            Write-Host "Tempo restante: $restante minutos"

            Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       PC VIRTUAL V5 ENCERRADO"
          Write-Host "======================================"
